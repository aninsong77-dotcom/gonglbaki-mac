name: Build Mac DMG

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r server/requirements-mac.txt

      - name: Build Python server (PyInstaller)
        run: |
          cd server
          pyinstaller app-mac.spec --noconfirm
          mkdir -p ../resources/server
          cp -r dist/app/* ../resources/server/

      - name: Build whisper.cpp
        run: |
          git clone --depth 1 https://github.com/ggerganov/whisper.cpp whisper-src
          cd whisper-src
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j$(sysctl -n hw.ncpu)
          mkdir -p ../resources/server/whisper-bin
          cp build/bin/whisper-cli ../resources/server/whisper-bin/whisper-cli
          chmod +x ../resources/server/whisper-bin/whisper-cli

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: npm install

      - name: Vite build
        run: npm run build

      - name: Resize icon to 512x512 (macOS requirement)
        run: sips -z 512 512 src/assets/gongulbaki-logo.png

      - name: Build DMG
        run: npm run build && npx electron-builder --publish never

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: gongulbaki-mac-dmg
          path: release/*.dmg
          retention-days: 7

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mac-jitless
          name: 곤글박이 Mac (macOS 26 시작 크래시 수정 · JIT-less)
          body: |
            macOS 26(Tahoe) 시작 즉시 크래시(EXC_BREAKPOINT) 수정.
            원인: macOS 26의 강화된 MAP_JIT 규칙과 V8 JIT 충돌 → V8를 인터프리터 모드(--jitless)로 실행해 회피.
            Electron 38.8.6 기준.

            설치: 아래 .dmg를 받아 열고, 곤글박이를 응용 프로그램으로 끌어다 놓으세요.
            (기존 곤글박이는 먼저 삭제 후 설치 권장. 첫 실행 "확인되지 않은 개발자" 뜨면: 앱 우클릭 → 열기 → 열기)
          files: release/*.dmg
