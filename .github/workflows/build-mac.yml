name: Build Mac DMG

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r server/requirements-mac.txt

      - name: Build Python server (PyInstaller)
        run: |
          cd server
          pyinstaller app-mac.spec --noconfirm
          mkdir -p ../resources/server
          cp -r dist/app/* ../resources/server/

      - name: Build whisper.cpp
        run: |
          git clone --depth 1 https://github.com/ggerganov/whisper.cpp whisper-src
          cd whisper-src
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j$(sysctl -n hw.ncpu)
          mkdir -p ../resources/server/whisper-bin
          cp build/bin/whisper-cli ../resources/server/whisper-bin/whisper-cli
          chmod +x ../resources/server/whisper-bin/whisper-cli

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: npm install

      - name: Vite build
        run: npm run build

      - name: Resize icon to 512x512 (macOS requirement)
        run: sips -z 512 512 src/assets/gongulbaki-logo.png

      - name: Build DMG
        run: npx electron-builder --publish never

      - name: Build PKG installer
        run: |
          chmod +x scripts/pkg-scripts/postinstall
          pkgbuild \
            --root "release/mac-arm64" \
            --install-location "/Applications" \
            --scripts scripts/pkg-scripts \
            --identifier "com.aninsong.gongulbaki" \
            --version "1.0.0" \
            "release/Gonglbaki-1.0.0-arm64.pkg"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gongulbaki-mac
          path: |
            release/*.dmg
            release/*.pkg
          retention-days: 7

      - name: Delete existing release
        run: gh release delete mac-latest --yes 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mac-latest
          name: 곤글박이 Mac (최신)
          body: |
            ## 곤글박이 Mac 최신 빌드

            ### 설치 방법

            1. 아래 **Gonglbaki-1.0.0-arm64.dmg** 다운로드
            2. DMG 열고 곤글박이 아이콘을 **응용 프로그램(Applications)** 폴더로 드래그
            3. 응용 프로그램에서 곤글박이 실행 시도 → 경고 뜨면 확인 클릭
            4. **시스템 설정 → 개인 정보 보호 및 보안** 으로 이동
            5. 화면 아래로 스크롤 → **"그래도 열기"** 클릭
            6. 이후부터는 바로 실행됩니다 ✅

            > ⚠️ 처음 한 번만 위 과정이 필요합니다. 이후 실행은 아이콘 클릭으로 바로 됩니다.
          files: |
            release/*.dmg
